root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = "./tmp/server"
delay = 200
exclude_dir = ["tmp", "data", "migrations"]
include_ext = ["go"]
exclude_regex = ["_test\\.go", "\\.sql\\.go$"]
stop_on_error = true
send_interrupt = true

[log]
time = false

[misc]
clean_on_exit = true
